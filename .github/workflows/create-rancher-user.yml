name: "Create Rancher User via Ansible"

on:
  workflow_dispatch:
    inputs:
      new_username:
        description: "New Rancher username"
        required: true
      new_password:
        description: "New Rancher user password (min 12 chars)"
        required: true
      full_name:
        description: "Full name / display name"
        required: false
      cluster_id:
        description: "Cluster ID (e.g. c-xxxxx)"
        required: false
      cluster_role_template_id:
        description: "Cluster Role Template ID (e.g. cluster-member)"
        required: false

jobs:
  create_user:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install jq
      run: sudo apt-get install -y jq

    - name: Setup Python & Ansible
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install ansible requests hvac

    - name: Vault Login and Export Token
      id: vault_login
      env:
        VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
        VAULT_USERNAME: ${{ secrets.VAULT_USERNAME }}
        VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
      run: |
        echo "Logging into Vault..."
        RESPONSE=$(curl --fail --request POST \
          --data "{\"password\": \"${VAULT_PASSWORD}\"}" \
          ${VAULT_ADDR}/v1/auth/userpass/login/${VAULT_USERNAME})
        echo "Vault Response: $RESPONSE"  # Debug
        export VAULT_TOKEN=$(echo "$RESPONSE" | jq -r '.auth.client_token')
        echo "VAULT_TOKEN=${VAULT_TOKEN}" >> $GITHUB_ENV
        echo "Token exported to GITHUB_ENV"

    - name: Run Ansible Playbook
      env:
        RANCHER_API_URL: ${{ secrets.RANCHER_API_URL }}
        RANCHER_API_TOKEN: ${{ secrets.RANCHER_API_TOKEN }}
        VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
        VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
        NEW_USERNAME: ${{ github.event.inputs.new_username }}
        NEW_PASSWORD: ${{ github.event.inputs.new_password }}
        FULL_NAME: ${{ github.event.inputs.full_name }}
        CLUSTER_ID: ${{ github.event.inputs.cluster_id }}
        CLUSTER_ROLE_TEMPLATE_ID: ${{ github.event.inputs.cluster_role_template_id }}
      run: |
        source venv/bin/activate
        echo "VAULT_TOKEN (in Ansible step): $VAULT_TOKEN"  # Debug
        ansible-playbook rancher/create_rancher_user.yml -vvv
