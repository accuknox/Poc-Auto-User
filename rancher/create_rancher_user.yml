---
- name: Create Rancher User and assign cluster access
  hosts: localhost
  gather_facts: false
  vars:
    rancher_url: "{{ lookup('env', 'RANCHER_API_URL') }}"
    rancher_token: "{{ lookup('env', 'RANCHER_API_TOKEN') }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    new_username: "{{ lookup('env', 'NEW_USERNAME') }}"
    new_password: "{{ lookup('env', 'NEW_PASSWORD') }}"
    full_name: "{{ lookup('env', 'FULL_NAME') }}"
    cluster_id: "{{ lookup('env', 'CLUSTER_ID') | default('') }}"
    cluster_role_template_id: "{{ lookup('env', 'CLUSTER_ROLE_TEMPLATE_ID') | default('') }}"

  tasks:
    - name: Create Rancher user
      uri:
        url: "{{ rancher_url }}/v3/users"
        method: POST
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ new_username }}"
          password: "{{ new_password }}"
          name: "{{ full_name }}"
          enabled: true
        status_code: [201, 409]
      register: create_user_response
      no_log: true

    - name: Fail if user creation failed
      fail:
        msg: "Failed to create user: HTTP {{ create_user_response.status }}"
      when: create_user_response.status not in [201, 409]

    - name: Get user ID if created
      set_fact:
        user_id: "{{ create_user_response.json.id }}"
      when: create_user_response.status == 201

    - name: Check if user already exists in Vault
      uri:
        url: "{{ vault_addr }}/v1/Admin-Credentials/rancher/{{ new_username }}"
        method: GET
        headers:
          X-Vault-Token: "{{ vault_token }}"
          Content-Type: "application/json"
        status_code: [200, 404]
      register: vault_check
      ignore_errors: yes
      no_log: true

    - name: Fail if Vault user exists
      fail:
        msg: "User {{ new_username }} already exists in Vault!"
      when: vault_check.status == 200

    - name: Store Rancher credentials in Vault (per-user path)
      uri:
        url: "{{ vault_addr }}/v1/Admin-Credentials/rancher/{{ new_username }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          data:
            username: "{{ new_username }}"
            password: "{{ new_password }}"
        status_code: [200, 204]
      when: create_user_response.status == 201
      no_log: true

    - name: Assign cluster role to user (if cluster_id provided)
      uri:
        url: "{{ rancher_url }}/v3/clusterroletemplatebindings"
        method: POST
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          clusterId: "{{ cluster_id }}"
          roleTemplateId: "{{ cluster_role_template_id }}"
          userPrincipalId: "local://{{ user_id }}"
        status_code: [201, 409]
      when: 
        - user_id is defined
        - cluster_id | length > 0
      no_log: true
