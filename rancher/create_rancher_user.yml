---
- name: Create Rancher User and assign cluster access
  hosts: localhost
  gather_facts: false
  vars:
    rancher_url: "{{ lookup('env', 'RANCHER_API_URL') }}"
    rancher_token: "{{ lookup('env', 'RANCHER_API_TOKEN') }}"
    vault_addr: "{{ lookup('env', 'VAULT_ADDR') }}"
    vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
    new_username: "{{ lookup('env', 'NEW_USERNAME') }}"
    new_password: "{{ lookup('env', 'NEW_PASSWORD') }}"
    full_name: "{{ lookup('env', 'FULL_NAME') }}"
    cluster_id: "{{ lookup('env', 'CLUSTER_ID') }}"
    cluster_role_template_id: "{{ lookup('env', 'CLUSTER_ROLE_TEMPLATE_ID') }}"

  tasks:
    - name: Create Rancher user
      uri:
        url: "{{ rancher_url }}/v3/users"
        method: POST
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ new_username }}"
          password: "{{ new_password }}"
          name: "{{ full_name }}"
          enabled: true
        status_code: [201, 409]
      register: create_user_response
      no_log: true

    - name: Store Rancher credentials in Vault
      uri:
        url: "{{ vault_addr }}/v1/secret/data/rancher/{{ new_username }}"
        method: POST
        headers:
          X-Vault-Token: "{{ vault_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          data:
            username: "{{ new_username }}"
            password: "{{ new_password }}"
        status_code: [200, 204]
      no_log: true

    - name: Assign cluster role to user
      uri:
        url: "{{ rancher_url }}/v3/clusterroletemplatebindings"
        method: POST
        headers:
          Authorization: "Bearer {{ rancher_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          clusterId: "{{ cluster_id }}"
          roleTemplateId: "{{ cluster_role_template_id }}"
          userPrincipalId: "local://{{ new_username }}"
        status_code: [201, 409]
      no_log: true
